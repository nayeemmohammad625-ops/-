<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="hoodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Outer decorative border ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="16, 10" opacity="0.6"/>
  
  <!-- Rickshaw Hood / Canopy with Bangladeshi Folk Art Scallops -->
  <path d="M 120 250 C 120 140, 200 110, 290 120 C 310 125, 330 150, 310 240 Z" fill="url(#hoodGrad)" stroke="#fde047" stroke-width="8" stroke-linejoin="round"/>
  <!-- Canopy stripes -->
  <path d="M 160 248 C 170 170, 230 130, 290 120" fill="none" stroke="#fde047" stroke-width="5" opacity="0.9" />
  <path d="M 210 246 C 220 185, 260 140, 290 120" fill="none" stroke="#60a5fa" stroke-width="5" opacity="0.9" />
  
  <!-- Passenger Seat Cushion -->
  <path d="M 170 240 L 300 240 C 310 240, 315 255, 305 265 L 180 270 C 165 270, 160 250, 170 240 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="5"/>
  
  <!-- Rickshaw Frame / Chassis -->
  <path d="M 190 320 L 290 270 L 360 260 L 410 320 L 380 210" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 290 270 L 300 320" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Handlebars & Brass Bell -->
  <path d="M 360 220 L 390 200 L 410 205" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>
  <circle cx="395" cy="195" r="10" fill="url(#goldGrad)" stroke="#78350f" stroke-width="3" />
  
  <!-- Big Rear Wheel -->
  <g transform="translate(190, 335)">
    <circle cx="0" cy="0" r="62" fill="#1e293b" stroke="#f8fafc" stroke-width="7"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#d97706" stroke-width="5"/>
    <circle cx="0" cy="0" r="16" fill="url(#goldGrad)" stroke="#78350f" stroke-width="3"/>
    <!-- Wheel Spokes -->
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#fde047" stroke-width="3"/>
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#fde047" stroke-width="3"/>
    <line x1="-35" y1="-35" x2="35" y2="35" stroke="#fde047" stroke-width="3"/>
    <line x1="-35" y1="35" x2="35" y2="-35" stroke="#fde047" stroke-width="3"/>
  </g>
  
  <!-- Front Wheel -->
  <g transform="translate(410, 335)">
    <circle cx="0" cy="0" r="50" fill="#1e293b" stroke="#f8fafc" stroke-width="6"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#d97706" stroke-width="4"/>
    <circle cx="0" cy="0" r="14" fill="url(#goldGrad)" stroke="#78350f" stroke-width="3"/>
    <!-- Spokes -->
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#fde047" stroke-width="2.5"/>
    <line x1="0" y1="-40" x2="0" y2="40" stroke="#fde047" stroke-width="2.5"/>
    <line x1="-28" y1="-28" x2="28" y2="28" stroke="#fde047" stroke-width="2.5"/>
    <line x1="-28" y1="28" x2="28" y2="-28" stroke="#fde047" stroke-width="2.5"/>
  </g>

  <!-- Speed lines & Starburst -->
  <path d="M 60 210 L 100 210" stroke="#34d399" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 40 250 L 95 250" stroke="#fde047" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 70 290 L 120 290" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- Banner text / 3D Rickshaw Rush -->
  <rect x="96" y="415" width="320" height="52" rx="16" fill="#10b981" stroke="#34d399" stroke-width="3"/>
  <text x="256" y="450" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="2">RICKSHAW RUSH</text>
</svg>
